<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>饥荒地皮规划器</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden}
  body{
    font-family:system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;
    background:#12100e;color:#e8e0d0;
    user-select:none;-webkit-user-select:none;-moz-user-select:none;
    display:flex;flex-direction:column;
  }

  /* ---------- 顶栏 ---------- */
  header{
    display:flex;align-items:center;gap:5px;padding:0 10px;
    height:46px;flex:none;background:#1e1a16;
    border-bottom:1px solid #302a23;overflow-x:auto;overflow-y:hidden;
  }
  header::-webkit-scrollbar{height:5px}
  header::-webkit-scrollbar-thumb{background:#3a322a;border-radius:3px}
  header button{
    background:#2a231d;color:#d8cfc0;border:1px solid #3a322a;
    border-radius:6px;padding:6px 10px;font-size:12.5px;cursor:pointer;
    white-space:nowrap;transition:.12s;flex:none;font-family:inherit;
  }
  header button:hover:not(:disabled){background:#3a3128;border-color:#5a4c3e;color:#fff}
  header button.active{background:#d9a441;color:#1a1410;border-color:#d9a441;font-weight:600}
  header button:disabled{opacity:.28;cursor:not-allowed}
  .sep{width:1px;height:22px;background:#332c25;margin:0 4px;flex:none}

  /* ---------- 主体 ---------- */
  .body{flex:1;display:flex;min-height:0}

  aside{
    width:206px;flex:none;background:#1a1613;
    border-right:1px solid #302a23;overflow-y:auto;padding:12px 12px 40px;
  }
  aside::-webkit-scrollbar{width:7px}
  aside::-webkit-scrollbar-thumb{background:#3a322a;border-radius:4px}
  .sec{
    font-size:10.5px;letter-spacing:1.4px;color:#7d7264;
    margin:0 0 8px;text-transform:uppercase;font-weight:600;
  }
  .sec:not(:first-child){margin-top:20px}

  #palette{
    display:grid;grid-template-columns:repeat(5,1fr);gap:5px;
  }
  .sw{
    aspect-ratio:1;border-radius:5px;cursor:pointer;
    border:2px solid transparent;
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.12);
    transition:transform .1s;
  }
  .sw:hover{transform:scale(1.12)}
  .sw.on{
    border-color:#fff;
    box-shadow:0 0 0 2px #d9a441,inset 0 0 0 1px rgba(0,0,0,.3);
    transform:scale(1.1);
  }
  .sw.empty{
    background:repeating-linear-gradient(45deg,#2b2b2b 0 5px,#3c3c3c 5px 10px);
  }

  /* 建筑点位列表 */
  #builds{display:flex;flex-direction:column;gap:3px}
  .bld{
    display:flex;align-items:center;gap:8px;padding:5px 7px;
    border-radius:6px;cursor:pointer;border:1px solid transparent;
    font-size:12.5px;transition:.12s;
  }
  .bld:hover{background:#2a231d}
  .bld.on{background:#33291d;border-color:#d9a441}
  .bico{
    width:15px;text-align:center;font-size:12px;line-height:1;flex:none;
    font-weight:700;
  }
  .bname{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .brad{color:#8b8071;font-size:11px;font-variant-numeric:tabular-nums}

  .side-btn{
    width:100%;margin-top:8px;background:#2a231d;color:#d8cfc0;
    border:1px solid #3a322a;border-radius:6px;padding:7px;
    font-size:12px;cursor:pointer;font-family:inherit;transition:.12s;
  }
  .side-btn:hover{background:#3a3128;border-color:#5a4c3e;color:#fff}

  select{
    width:100%;background:#2a231d;color:#d8cfc0;border:1px solid #3a322a;
    border-radius:6px;padding:7px 8px;font-size:12.5px;font-family:inherit;
    cursor:pointer;outline:none;
  }
  select:hover{border-color:#5a4c3e}

  main{flex:1;position:relative;min-width:0;overflow:hidden;background:#12100e}
  canvas{
    display:block;
    touch-action:none;
    user-select:none;-webkit-user-select:none;
    -webkit-user-drag:none;
    -webkit-tap-highlight-color:transparent;
    outline:none;
  }
  .hint{
    position:absolute;left:12px;bottom:10px;font-size:11px;color:#6a6055;
    background:rgba(18,16,14,.82);padding:5px 10px;border-radius:6px;
    pointer-events:none;border:1px solid #2a241e;
  }

  /* ---------- 底栏 ---------- */
  footer{
    flex:none;height:28px;display:flex;align-items:center;gap:22px;
    padding:0 14px;background:#1e1a16;border-top:1px solid #302a23;
    font-size:11.5px;color:#8b8071;
  }
  footer b{color:#d9a441;font-weight:600}

  #toast{
    position:fixed;left:50%;top:64px;transform:translate(-50%,-10px);
    background:#2c2419;color:#d9a441;border:1px solid #d9a441;
    padding:8px 18px;border-radius:8px;font-size:13px;
    opacity:0;transition:.22s;pointer-events:none;z-index:99;
    box-shadow:0 6px 20px rgba(0,0,0,.5);
  }
  #toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>

<header>
  <button data-tool="brush" class="active" title="画笔 (B)">🖌 画笔</button>
  <button data-tool="drag" title="拖拽画布 (D)">✋ 拖拽</button>
  <button data-tool="place" title="放置点位 (P)">📍 点位</button>
  <div class="sep"></div>
  <button id="undo" title="撤销 Ctrl+Z">↶ 撤销</button>
  <button id="redo" title="重做 Ctrl+Y">↷ 重做</button>
  <button id="clear" title="清空全部">🗑 清空</button>
  <div class="sep"></div>
  <button id="fit" title="显示全图 (0)">⤢ 全图</button>
  <button id="zo">−</button>
  <button id="zi">＋</button>
  <div class="sep"></div>
  <button id="export">⬇ 导出图片</button>
  <button id="save">💾 保存</button>
  <button id="load">📂 读取</button>
</header>

<div class="body">
  <aside>
    <div class="sec">地皮颜色</div>
    <div id="palette"></div>

    <div class="sec">建筑点位</div>
    <div id="builds"></div>
    <button class="side-btn" id="clearPts">清空所有点位</button>

    <div class="sec">地图尺寸</div>
    <select id="sizeSel">
      <option value="100" selected>100 × 100</option>
      <option value="120">120 × 120</option>
      <option value="150">150 × 150</option>
      <option value="200">200 × 200</option>
      <option value="300">300 × 300</option>
    </select>
  </aside>

  <main id="stage">
    <canvas id="board"></canvas>
    <div class="hint" id="hintBar">画笔：左键涂色 · 点位：左键放置 / 右键删除 · 拖拽：按住任意键移动</div>
  </main>
</div>

<footer>
  <span>坐标 <b id="posInfo">—</b></span>
  <span>格子 <b id="zoomInfo">—</b></span>
  <span>尺寸 <b id="sizeInfo">100 × 100</b></span>
  <span>已规划 <b id="statInfo">0</b> 格</span>
  <span>点位 <b id="ptInfo">0</b> 个</span>
</footer>

<div id="toast"></div>

<script>
(function(){
'use strict';

/* =====================================================
   颜色
   ===================================================== */
const COLORS = [
  '#6aa84f','#4e8a38','#3a6b2a','#2d5220','#8fa84a','#b6c95a',
  '#c9a86a','#b07d42','#8a5a2a','#6b4a2a','#4a3524',
  '#e6d79a','#d9c072','#a89878',
  '#f2f2ec','#d0d0c8','#a8a8a0','#7c7c74','#545450','#38383a',
  '#7a9ec2','#5a7a9a','#3fa89a','#4a6f7a','#2d4a55',
  '#c2555a','#9c3b3b','#c4551f','#d4a92a','#d9a441',
  '#9c7ab8','#7c5f96','#4a3550','#d8a8c8','#ffd9e8'
];
const NCOLOR = COLORS.length;

function hexToRgb(hex){
  const n = parseInt(hex.slice(1),16);
  return [(n>>16)&255,(n>>8)&255,n&255];
}
const COL_RGB = COLORS.map(hexToRgb);

function hexA(hex, a){
  const n = parseInt(hex.slice(1),16);
  return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${a})`;
}

/* =====================================================
   建筑点位定义
   ===================================================== */
const BUILDINGS = [
  { name:'龙鳞火炉',   radius:9.5, color:'#e0402c', shape:'circle'   },
  { name:'冰眼结晶器', radius:35,  color:'#2f6fd9', shape:'circle'   },
  { name:'雪球发射器', radius:15,  color:'#2f6fd9', shape:'x'        },
  { name:'避雷针',     radius:40,  color:'#3a9c3a', shape:'triangle' }
];

/* =====================================================
   状态
   ===================================================== */
let W = 100, H = 100;
let data = new Uint8Array(W*H);          // 地皮
let points = [];                          // 点位 [{x,y,t}]
let paintedCount = 0;

const canvas = document.getElementById('board');
const ctx = canvas.getContext('2d');
const stage = document.getElementById('stage');

const dc = document.createElement('canvas');
dc.width = W; dc.height = H;
const dctx = dc.getContext('2d', {willReadFrequently:true});
let imgData = dctx.createImageData(W,H);

let cssW = 0, cssH = 0, dpr = 1;

let scale = 12;
let offX = 0, offY = 0;
const MIN_SCALE = 1.5, MAX_SCALE = 60;

let tool = 'brush';        // 'brush' | 'drag' | 'place'
let cur = 1;               // 当前颜色索引
let curB = 0;              // 当前建筑索引

let drawing = false;
let panning = false;
let lastGX = null, lastGY = null;
let panStart = {x:0, y:0, ox:0, oy:0};
let hoverX = -1, hoverY = -1;
let spaceDown = false;

let strokeSnap = null, strokeDirty = false;
let history = [], future = [];
const MAX_HISTORY = 60;

const clamp = (v,a,b)=> v<a?a:(v>b?b:v);

/* =====================================================
   离屏地皮画布
   ===================================================== */
function rebuild(){
  imgData = dctx.createImageData(W,H);
  const d = imgData.data;
  const n = W*H;
  for(let i=0;i<n;i++){
    const v = data[i];
    if(v){
      const c = COL_RGB[v-1];
      const o = i<<2;
      d[o]=c[0]; d[o+1]=c[1]; d[o+2]=c[2]; d[o+3]=255;
    }
  }
  dctx.putImageData(imgData,0,0);
}

function updatePixel(x,y){
  const v = data[y*W+x];
  if(v===0) dctx.clearRect(x,y,1,1);
  else{
    dctx.fillStyle = COLORS[v-1];
    dctx.fillRect(x,y,1,1);
  }
}

function countPainted(){
  let n=0;
  for(let i=0;i<data.length;i++) if(data[i]) n++;
  paintedCount = n;
}

/* =====================================================
   图标绘制（通用，可用于主画布 / 导出画布）
   ===================================================== */
function drawIcon(c, cx, cy, b, size){
  c.fillStyle = b.color;
  c.strokeStyle = b.color;
  c.lineWidth = Math.max(1.6, size*0.42);
  c.lineCap = 'round';

  if(b.shape === 'circle'){
    c.beginPath();
    c.arc(cx, cy, size, 0, Math.PI*2);
    c.fill();
  }else if(b.shape === 'x'){
    c.beginPath();
    c.moveTo(cx-size, cy-size); c.lineTo(cx+size, cy+size);
    c.moveTo(cx+size, cy-size); c.lineTo(cx-size, cy+size);
    c.stroke();
  }else{ // triangle
    c.beginPath();
    c.moveTo(cx, cy-size*1.15);
    c.lineTo(cx+size, cy+size*0.8);
    c.lineTo(cx-size, cy+size*0.8);
    c.closePath();
    c.fill();
  }
}

/* =====================================================
   渲染
   ===================================================== */
let rafId = 0;
function scheduleRender(){
  if(rafId) return;
  rafId = requestAnimationFrame(()=>{ rafId=0; render(); });
}

function render(){
  if(!cssW || !cssH) return;

  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,cssW,cssH);

  ctx.fillStyle = '#12100e';
  ctx.fillRect(0,0,cssW,cssH);

  const mapW = W*scale, mapH = H*scale;

  // 地图底板
  ctx.fillStyle = '#1d1915';
  ctx.fillRect(offX, offY, mapW, mapH);

  const gx0 = Math.max(0, Math.floor(-offX/scale));
  const gy0 = Math.max(0, Math.floor(-offY/scale));
  const gx1 = Math.min(W, Math.ceil((cssW-offX)/scale));
  const gy1 = Math.min(H, Math.ceil((cssH-offY)/scale));

  // 地皮
  if(gx1>gx0 && gy1>gy0){
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(
      dc, gx0, gy0, gx1-gx0, gy1-gy0,
      offX+gx0*scale, offY+gy0*scale,
      (gx1-gx0)*scale, (gy1-gy0)*scale
    );
  }

  // 网格
  ctx.save();
  ctx.beginPath();
  ctx.rect(offX, offY, mapW, mapH);
  ctx.clip();

  if(scale >= 4.5){
    ctx.beginPath();
    ctx.strokeStyle = 'rgba(255,255,255,0.13)';
    ctx.lineWidth = 1;
    for(let x=gx0;x<=gx1;x++){
      const px = Math.round(offX + x*scale) + 0.5;
      ctx.moveTo(px, offY); ctx.lineTo(px, offY+mapH);
    }
    for(let y=gy0;y<=gy1;y++){
      const py = Math.round(offY + y*scale) + 0.5;
      ctx.moveTo(offX, py); ctx.lineTo(offX+mapW, py);
    }
    ctx.stroke();
  }

  if(scale >= 2){
    ctx.beginPath();
    ctx.strokeStyle = 'rgba(255,255,255,0.26)';
    ctx.lineWidth = 1;
    const sx = Math.ceil(gx0/10)*10;
    const sy = Math.ceil(gy0/10)*10;
    for(let x=sx;x<=gx1;x+=10){
      const px = Math.round(offX + x*scale) + 0.5;
      ctx.moveTo(px, offY); ctx.lineTo(px, offY+mapH);
    }
    for(let y=sy;y<=gy1;y+=10){
      const py = Math.round(offY + y*scale) + 0.5;
      ctx.moveTo(offX, py); ctx.lineTo(offX+mapW, py);
    }
    ctx.stroke();
  }
  ctx.restore();

  // 地图边框
  ctx.strokeStyle = 'rgba(217,164,65,0.9)';
  ctx.lineWidth = 2;
  ctx.strokeRect(offX-1, offY-1, mapW+2, mapH+2);

  /* ============ 点位与作用半径 ============ */
  const iconS = clamp(scale*0.36, 4, 9);

  // 半径圆
  if(points.length){
    ctx.lineWidth = 2;
    for(const p of points){
      const b = BUILDINGS[p.t];
      const cx = offX + (p.x+0.5)*scale;
      const cy = offY + (p.y+0.5)*scale;
      const r  = b.radius*scale;
      if(r < 2.5) continue;
      ctx.beginPath();
      ctx.arc(cx, cy, r, 0, Math.PI*2);
      ctx.strokeStyle = hexA(b.color, 0.78);
      ctx.stroke();
    }
    // 图标
    for(const p of points){
      const b = BUILDINGS[p.t];
      const cx = offX + (p.x+0.5)*scale;
      const cy = offY + (p.y+0.5)*scale;
      drawIcon(ctx, cx, cy, b, iconS);
    }
  }

  /* ============ 悬停效果 ============ */
  if(!panning && hoverX>=0 && hoverX<W && hoverY>=0 && hoverY<H){

    // 画笔模式：格子高亮
    if(tool === 'brush' && scale >= 4){
      const px = offX + hoverX*scale;
      const py = offY + hoverY*scale;
      ctx.strokeStyle = 'rgba(255,255,255,0.95)';
      ctx.lineWidth = 2;
      ctx.strokeRect(Math.round(px)-1, Math.round(py)-1,
                     Math.round(scale)+2, Math.round(scale)+2);
    }

    // 点位模式：虚线预览半径
    if(tool === 'place'){
      const b  = BUILDINGS[curB];
      const cx = offX + (hoverX+0.5)*scale;
      const cy = offY + (hoverY+0.5)*scale;

      ctx.save();
      ctx.setLineDash([6,5]);
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(cx, cy, b.radius*scale, 0, Math.PI*2);
      ctx.strokeStyle = hexA(b.color, 0.45);
      ctx.stroke();
      ctx.restore();

      ctx.globalAlpha = 0.55;
      drawIcon(ctx, cx, cy, b, iconS);
      ctx.globalAlpha = 1;
    }
  }

  /* ============ 图例 ============ */
  drawLegend();
}

function drawLegend(){
  if(!points.length) return;

  const used = new Set(points.map(p=>p.t));
  const list = [...used].sort((a,b)=>a-b);

  const pad = 8, lh = 18;
  const x = 12, y = 12;

  ctx.font = '12px system-ui,sans-serif';
  let maxW = 0;
  for(const ti of list){
    const b = BUILDINGS[ti];
    const w = ctx.measureText(`${b.name} ${b.radius}`).width;
    if(w > maxW) maxW = w;
  }
  const boxW = maxW + 34 + pad*2;
  const boxH = list.length*lh + pad*2;

  ctx.fillStyle = 'rgba(18,15,13,0.85)';
  ctx.fillRect(x, y, boxW, boxH);
  ctx.strokeStyle = 'rgba(255,255,255,0.14)';
  ctx.lineWidth = 1;
  ctx.strokeRect(x+0.5, y+0.5, boxW-1, boxH-1);

  list.forEach((ti, i)=>{
    const b  = BUILDINGS[ti];
    const cy = y + pad + i*lh + lh/2;
    drawIcon(ctx, x+pad+8, cy, b, 5);
    ctx.fillStyle = '#d8cfc0';
    ctx.font = '12px system-ui,sans-serif';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    ctx.fillText(`${b.name} ${b.radius}`, x+pad+20, cy);
  });
}

/* =====================================================
   视图控制
   ===================================================== */
function clampView(){
  const mw = W*scale, mh = H*scale;
  const pad = 50;
  if(mw <= cssW) offX = (cssW-mw)/2;
  else offX = clamp(offX, cssW-mw-pad, pad);

  if(mh <= cssH) offY = (cssH-mh)/2;
  else offY = clamp(offY, cssH-mh-pad, pad);
}

function fitView(){
  if(!cssW || !cssH) return;
  const pad = 26;
  scale = clamp(Math.min((cssW-pad*2)/W, (cssH-pad*2)/H), MIN_SCALE, MAX_SCALE);
  offX = (cssW - W*scale)/2;
  offY = (cssH - H*scale)/2;
  updateInfo();
  scheduleRender();
}

function initView(){
  if(!cssW || !cssH) return;
  const fit = Math.min((cssW-40)/W, (cssH-40)/H);
  scale = clamp(Math.max(fit, 11), MIN_SCALE, MAX_SCALE);
  offX = (cssW - W*scale)/2;
  offY = (cssH - H*scale)/2;
  clampView();
  updateInfo();
  scheduleRender();
}

function zoomAt(mx,my,ns){
  ns = clamp(ns, MIN_SCALE, MAX_SCALE);
  if(Math.abs(ns-scale) < 0.001) return;
  offX = mx - (mx-offX)*(ns/scale);
  offY = my - (my-offY)*(ns/scale);
  scale = ns;
  clampView();
  updateInfo();
  scheduleRender();
}

function updateInfo(){
  document.getElementById('zoomInfo').textContent = scale.toFixed(1)+' px';
  document.getElementById('sizeInfo').textContent = W+' × '+H;
  document.getElementById('statInfo').textContent = paintedCount;
  document.getElementById('ptInfo').textContent = points.length;
}

/* =====================================================
   坐标
   ===================================================== */
function getPos(e){
  const r = canvas.getBoundingClientRect();
  return {x:e.clientX-r.left, y:e.clientY-r.top};
}
function toGrid(px,py){
  return {
    x: Math.floor((px-offX)/scale),
    y: Math.floor((py-offY)/scale)
  };
}

/* 命中已有点位（屏幕坐标） */
function hitPoint(px, py){
  const hitR = clamp(scale*0.6, 10, 16);
  for(let i=points.length-1;i>=0;i--){
    const p  = points[i];
    const cx = offX + (p.x+0.5)*scale;
    const cy = offY + (p.y+0.5)*scale;
    if(Math.hypot(px-cx, py-cy) <= hitR) return i;
  }
  return -1;
}

/* =====================================================
   拖拽
   ===================================================== */
function startPan(e){
  panning = true;
  panStart = { x:e.clientX, y:e.clientY, ox:offX, oy:offY };
  canvas.style.cursor = 'grabbing';

  window.addEventListener('pointermove',  onPanMove,  true);
  window.addEventListener('pointerup',    onPanEnd,   true);
  window.addEventListener('pointercancel',onPanEnd,   true);
  window.addEventListener('blur',         onPanEnd,   true);
}
function onPanMove(e){
  if(!panning) return;
  e.preventDefault();
  offX = panStart.ox + (e.clientX - panStart.x);
  offY = panStart.oy + (e.clientY - panStart.y);
  clampView();
  scheduleRender();
}
function onPanEnd(){
  if(!panning) return;
  panning = false;
  canvas.style.cursor = cursorForTool();

  window.removeEventListener('pointermove',  onPanMove,  true);
  window.removeEventListener('pointerup',    onPanEnd,   true);
  window.removeEventListener('pointercancel',onPanEnd,   true);
  window.removeEventListener('blur',         onPanEnd,   true);
}

/* =====================================================
   画笔
   ===================================================== */
function paintCell(x,y){
  if(x<0||y<0||x>=W||y>=H) return;
  const i = y*W+x;
  const v = cur;
  const old = data[i];
  if(old===v) return;
  data[i] = v;
  if(old===0 && v!==0) paintedCount++;
  else if(old!==0 && v===0) paintedCount--;
  strokeDirty = true;
  updatePixel(x,y);
}
function paintLine(x0,y0,x1,y1){
  let dx = Math.abs(x1-x0), sx = x0<x1?1:-1;
  let dy = -Math.abs(y1-y0), sy = y0<y1?1:-1;
  let err = dx+dy, guard=0;
  while(guard++ < 5000){
    paintCell(x0,y0);
    if(x0===x1 && y0===y1) break;
    const e2 = 2*err;
    if(e2>=dy){ err+=dy; x0+=sx; }
    if(e2<=dx){ err+=dx; y0+=sy; }
  }
}

/* =====================================================
   历史（同时记录地皮与点位）
   ===================================================== */
function snap(){
  return { d: data.slice(), p: points.map(o=>({...o})) };
}
function applySnap(s){
  data = s.d.slice();
  points = s.p.map(o=>({...o}));
  rebuild();
  countPainted();
}
function updateHistoryUI(){
  document.getElementById('undo').disabled = history.length===0;
  document.getElementById('redo').disabled = future.length===0;
}
function pushHistory(){
  history.push(snap());
  if(history.length>MAX_HISTORY) history.shift();
  future.length = 0;
  updateHistoryUI();
}
function undo(){
  if(!history.length) return;
  future.push(snap());
  applySnap(history.pop());
  updateInfo(); scheduleRender(); updateHistoryUI();
}
function redo(){
  if(!future.length) return;
  history.push(snap());
  applySnap(future.pop());
  updateInfo(); scheduleRender(); updateHistoryUI();
}

/* =====================================================
   尺寸
   ===================================================== */
function setSize(nw,nh){
  const nd = new Uint8Array(nw*nh);
  const mw = Math.min(W,nw), mh = Math.min(H,nh);
  for(let y=0;y<mh;y++)
    for(let x=0;x<mw;x++)
      nd[y*nw+x] = data[y*W+x];

  W = nw; H = nh; data = nd;
  dc.width = W; dc.height = H;
  imgData = dctx.createImageData(W,H);
  rebuild();
  countPainted();
  history.length = 0; future.length = 0;
  updateHistoryUI();
  fitView();
  updateInfo();
}

/* =====================================================
   画布尺寸
   ===================================================== */
function resize(){
  const r = stage.getBoundingClientRect();
  const nw = Math.max(1, r.width);
  const nh = Math.max(1, r.height);
  if(nw===cssW && nh===cssH) return;
  cssW = nw; cssH = nh;
  dpr = window.devicePixelRatio || 1;
  canvas.width  = Math.round(cssW*dpr);
  canvas.height = Math.round(cssH*dpr);
  canvas.style.width  = cssW+'px';
  canvas.style.height = cssH+'px';
  clampView();
  scheduleRender();
}

/* =====================================================
   指针事件
   ===================================================== */
function cursorForTool(){
  if(tool === 'drag')  return 'grab';
  if(tool === 'place') return 'copy';
  return 'crosshair';
}

canvas.addEventListener('contextmenu', e=>e.preventDefault());
window.addEventListener('contextmenu', e=>{
  if(e.target === canvas) e.preventDefault();
});
canvas.addEventListener('dragstart', e=>e.preventDefault());
canvas.addEventListener('selectstart', e=>e.preventDefault());

canvas.addEventListener('pointerdown', e=>{
  e.preventDefault();
  e.stopPropagation();

  // ---------- 拖拽工具：任意键 ----------
  if(tool === 'drag'){ startPan(e); return; }

  const p = getPos(e);

  // ---------- 点位工具 ----------
  if(tool === 'place'){
    // 中键 / 空格+左键 → 拖拽
    if(e.button === 1 || (spaceDown && e.button === 0)){ startPan(e); return; }

    // 右键 → 删除点位
    if(e.button === 2){
      const idx = hitPoint(p.x, p.y);
      if(idx >= 0){
        pushHistory();
        points.splice(idx, 1);
        updateInfo(); scheduleRender();
      }
      return;
    }

    // 左键 → 放置 / 点击已有点位则删除
    if(e.button === 0){
      const idx = hitPoint(p.x, p.y);
      if(idx >= 0){
        pushHistory();
        points.splice(idx, 1);
        updateInfo(); scheduleRender();
        return;
      }
      const g = toGrid(p.x, p.y);
      if(g.x>=0 && g.y>=0 && g.x<W && g.y<H){
        pushHistory();
        points.push({ x:g.x, y:g.y, t:curB });
        updateInfo(); scheduleRender();
      }
      return;
    }
    return;
  }

  // ---------- 画笔工具：只响应左键 ----------
  if(e.button !== 0) return;

  const g = toGrid(p.x, p.y);
  canvas.setPointerCapture(e.pointerId);
  strokeSnap = snap();
  strokeDirty = false;
  drawing = true;
  lastGX = g.x; lastGY = g.y;
  paintCell(g.x, g.y);
  updateInfo();
  scheduleRender();
});

canvas.addEventListener('pointermove', e=>{
  e.preventDefault();
  if(panning) return;

  const p = getPos(e);
  const g = toGrid(p.x, p.y);

  if(drawing){
    if(lastGX===null) paintCell(g.x, g.y);
    else paintLine(lastGX, lastGY, g.x, g.y);
    lastGX = g.x; lastGY = g.y;
    updateInfo();
    scheduleRender();
  }else{
    if(g.x!==hoverX || g.y!==hoverY){
      hoverX = g.x; hoverY = g.y;
      scheduleRender();
    }
  }

  const el = document.getElementById('posInfo');
  if(g.x>=0 && g.y>=0 && g.x<W && g.y<H) el.textContent = `(${g.x}, ${g.y})`;
  else el.textContent = '—';
});

function endPointer(){
  if(drawing){
    drawing = false;
    lastGX = lastGY = null;
    if(strokeDirty && strokeSnap){
      history.push(strokeSnap);
      if(history.length>MAX_HISTORY) history.shift();
      future.length = 0;
      updateHistoryUI();
    }
    strokeSnap = null;
    strokeDirty = false;
  }
}
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', endPointer);
canvas.addEventListener('pointerleave', ()=>{
  if(!drawing && !panning){
    hoverX = hoverY = -1;
    scheduleRender();
    document.getElementById('posInfo').textContent = '—';
  }
});

canvas.addEventListener('wheel', e=>{
  e.preventDefault();
  const p = getPos(e);
  const factor = Math.exp(-e.deltaY * 0.0015);
  zoomAt(p.x, p.y, scale*factor);
}, {passive:false});

/* =====================================================
   键盘
   ===================================================== */
window.addEventListener('keydown', e=>{
  const tag = (e.target.tagName||'').toUpperCase();
  if(tag==='INPUT'||tag==='SELECT'||tag==='TEXTAREA') return;

  if(e.code === 'Space'){
    e.preventDefault();
    if(!spaceDown){
      spaceDown = true;
      if(!drawing && !panning) canvas.style.cursor = 'grab';
    }
    return;
  }
  if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='z'){
    e.preventDefault();
    e.shiftKey ? redo() : undo();
    return;
  }
  if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='y'){
    e.preventDefault(); redo(); return;
  }
  if(e.ctrlKey||e.metaKey) return;

  switch(e.key.toLowerCase()){
    case 'b': setTool('brush'); break;
    case 'd': setTool('drag');  break;
    case 'p': setTool('place'); break;
    case '0': fitView(); break;
    case '+': case '=': zoomAt(cssW/2, cssH/2, scale*1.25); break;
    case '-': case '_': zoomAt(cssW/2, cssH/2, scale/1.25); break;
  }
});
window.addEventListener('keyup', e=>{
  if(e.code === 'Space'){
    spaceDown = false;
    if(!drawing && !panning) canvas.style.cursor = cursorForTool();
  }
});

/* =====================================================
   调色板
   ===================================================== */
const paletteEl = document.getElementById('palette');

const emptyEl = document.createElement('div');
emptyEl.className = 'sw empty';
emptyEl.title = '空地 / 擦除';
emptyEl.dataset.i = '0';
emptyEl.addEventListener('click', ()=>{ setCurrent(0); setTool('brush'); });
paletteEl.appendChild(emptyEl);

COLORS.forEach((hex,i)=>{
  const el = document.createElement('div');
  el.className = 'sw';
  el.style.background = hex;
  el.dataset.i = String(i+1);
  el.title = hex;
  el.addEventListener('click', ()=>{ setCurrent(i+1); setTool('brush'); });
  paletteEl.appendChild(el);
});

function setCurrent(i){
  cur = i;
  [...paletteEl.children].forEach(el=>{
    el.classList.toggle('on', Number(el.dataset.i)===i);
  });
}

/* =====================================================
   建筑列表
   ===================================================== */
const buildsEl = document.getElementById('builds');
const SHAPE_CHAR = { circle:'●', x:'✕', triangle:'▲' };

BUILDINGS.forEach((b, i)=>{
  const el = document.createElement('div');
  el.className = 'bld' + (i===0 ? ' on' : '');
  el.dataset.i = i;
  el.innerHTML =
    `<span class="bico" style="color:${b.color}">${SHAPE_CHAR[b.shape]}</span>` +
    `<span class="bname">${b.name}</span>` +
    `<span class="brad">${b.radius}</span>`;
  el.addEventListener('click', ()=>{
    setBuilding(i);
    setTool('place');
  });
  buildsEl.appendChild(el);
});

function setBuilding(i){
  curB = i;
  [...buildsEl.children].forEach(el=>{
    el.classList.toggle('on', Number(el.dataset.i)===i);
  });
  scheduleRender();
}

document.getElementById('clearPts').addEventListener('click', ()=>{
  if(!points.length){ toast('还没有点位'); return; }
  if(!confirm('确定清空所有建筑点位？')) return;
  pushHistory();
  points = [];
  updateInfo(); scheduleRender();
  toast('点位已清空');
});

/* =====================================================
   工具切换
   ===================================================== */
function setTool(t){
  tool = t;
  document.querySelectorAll('header button[data-tool]').forEach(b=>{
    b.classList.toggle('active', b.dataset.tool===t);
  });
  canvas.style.cursor = cursorForTool();
  hoverX = hoverY = -1;

  const hint = document.getElementById('hintBar');
  if(t === 'brush') hint.textContent = '画笔：左键涂色 · 滚轮缩放';
  else if(t === 'place') hint.textContent = '点位：左键放置 / 点击已有点位删除 / 右键删除 · 中键或空格+左键拖拽';
  else hint.textContent = '拖拽：按住任意鼠标键移动画布 · 滚轮缩放';

  scheduleRender();
}

/* =====================================================
   顶栏按钮
   ===================================================== */
document.querySelectorAll('header button[data-tool]').forEach(b=>{
  b.addEventListener('click', ()=>setTool(b.dataset.tool));
});
document.getElementById('undo').addEventListener('click', undo);
document.getElementById('redo').addEventListener('click', redo);
document.getElementById('fit').addEventListener('click', fitView);
document.getElementById('zi').addEventListener('click', ()=>zoomAt(cssW/2, cssH/2, scale*1.3));
document.getElementById('zo').addEventListener('click', ()=>zoomAt(cssW/2, cssH/2, scale/1.3));

document.getElementById('clear').addEventListener('click', ()=>{
  if(paintedCount===0 && points.length===0){ toast('已经是空的啦'); return; }
  if(!confirm('确定清空全部地皮和点位？')) return;
  pushHistory();
  data = new Uint8Array(W*H);
  points = [];
  paintedCount = 0;
  rebuild(); updateInfo(); scheduleRender();
  toast('已清空');
});

document.getElementById('sizeSel').addEventListener('change', e=>{
  const n = Number(e.target.value);
  if(n===W) return;
  if((paintedCount>0 || points.length>0) &&
     !confirm(`切换到 ${n} × ${n} ？左上角已画的内容会保留`)){
    e.target.value = String(W);
    return;
  }
  setSize(n,n);
});

/* =====================================================
   导出 PNG
   ===================================================== */
document.getElementById('export').addEventListener('click', ()=>{
  const cell = 12;
  const c = document.createElement('canvas');
  c.width  = W*cell;
  c.height = H*cell;
  const g = c.getContext('2d');
  g.imageSmoothingEnabled = false;

  g.fillStyle = '#1d1915';
  g.fillRect(0,0,c.width,c.height);
  g.drawImage(dc, 0,0,W,H, 0,0,c.width,c.height);

  // 细网格
  g.strokeStyle = 'rgba(255,255,255,0.11)';
  g.lineWidth = 1;
  g.beginPath();
  for(let x=1;x<W;x++){ g.moveTo(x*cell+0.5,0); g.lineTo(x*cell+0.5,c.height); }
  for(let y=1;y<H;y++){ g.moveTo(0,y*cell+0.5); g.lineTo(c.width,y*cell+0.5); }
  g.stroke();

  // 10格粗线
  g.strokeStyle = 'rgba(255,255,255,0.28)';
  g.beginPath();
  for(let x=10;x<W;x+=10){ g.moveTo(x*cell+0.5,0); g.lineTo(x*cell+0.5,c.height); }
  for(let y=10;y<H;y+=10){ g.moveTo(0,y*cell+0.5); g.lineTo(c.width,y*cell+0.5); }
  g.stroke();

  // 半径圆
  const iconS = 7;
  g.lineWidth = 2;
  for(const p of points){
    const b = BUILDINGS[p.t];
    const cx = (p.x+0.5)*cell;
    const cy = (p.y+0.5)*cell;
    g.beginPath();
    g.arc(cx, cy, b.radius*cell, 0, Math.PI*2);
    g.strokeStyle = hexA(b.color, 0.78);
    g.stroke();
  }
  // 点位图标
  for(const p of points){
    const b = BUILDINGS[p.t];
    drawIcon(g, (p.x+0.5)*cell, (p.y+0.5)*cell, b, iconS);
  }

  const a = document.createElement('a');
  a.download = `地皮规划_${W}x${H}.png`;
  a.href = c.toDataURL('image/png');
  a.click();
  toast('已导出图片');
});

/* =====================================================
   保存 / 读取
   ===================================================== */
const STORE_KEY = 'turf_planner_v4';

function u8ToB64(u8){
  let s='';
  const CH=0x8000;
  for(let i=0;i<u8.length;i+=CH)
    s += String.fromCharCode.apply(null, u8.subarray(i, i+CH));
  return btoa(s);
}
function b64ToU8(b64){
  const s = atob(b64);
  const u8 = new Uint8Array(s.length);
  for(let i=0;i<s.length;i++) u8[i] = s.charCodeAt(i);
  return u8;
}

document.getElementById('save').addEventListener('click', ()=>{
  try{
    localStorage.setItem(STORE_KEY, JSON.stringify({
      w:W, h:H, d:u8ToB64(data), pts:points, v:4
    }));
    toast('已保存到浏览器');
  }catch(err){
    toast('保存失败：'+err.message);
  }
});

document.getElementById('load').addEventListener('click', ()=>{
  const raw = localStorage.getItem(STORE_KEY);
  if(!raw){ toast('没有找到存档'); return; }
  try{
    const o = JSON.parse(raw);
    W = o.w; H = o.h;
    dc.width = W; dc.height = H;
    imgData = dctx.createImageData(W,H);

    let arr = b64ToU8(o.d);
    if(arr.length !== W*H){
      const nd = new Uint8Array(W*H);
      nd.set(arr.subarray(0, Math.min(arr.length, nd.length)));
      arr = nd;
    }
    data = arr;
    points = Array.isArray(o.pts) ? o.pts.filter(p=>p && p.t>=0 && p.t<BUILDINGS.length) : [];

    countPainted();
    history.length = 0; future.length = 0;
    updateHistoryUI();
    rebuild();
    document.getElementById('sizeSel').value = String(W);
    fitView();
    updateInfo();
    toast('读取成功');
  }catch(err){
    toast('读取失败：'+err.message);
  }
});

/* =====================================================
   提示
   ===================================================== */
function toast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(el._t);
  el._t = setTimeout(()=>el.classList.remove('show'), 1400);
}

/* =====================================================
   启动
   ===================================================== */
new ResizeObserver(resize).observe(stage);
window.addEventListener('resize', resize);

setCurrent(1);
setBuilding(0);
setTool('brush');
rebuild();
countPainted();
updateInfo();
updateHistoryUI();

requestAnimationFrame(()=>{
  resize();
  initView();
  updateInfo();
});
setTimeout(()=>{ resize(); initView(); }, 60);

})();
</script>
